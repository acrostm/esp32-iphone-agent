name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests (simulator, unsigned)
        run: |
          sim=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+[A-Za-z ]*\(' | head -1 | sed 's/ ($//')
          echo "simulator: $sim"
          xcodebuild test -scheme IPhoneAgent -destination "platform=iOS Simulator,name=$sim" \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "NimBLE-Arduino@2.5.1"
      - name: Build
        run: hardware/flash.sh --build-only
      - name: Host tests (bplist, GOP buffer)
        run: make -C hardware/tests

  native-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Native protocol, display model, shared C and packaging tests
        run: python3 hardware/tests/native/run.py

  native-firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    strategy:
      matrix:
        board: [m5stack-stopwatch]
    steps:
      - uses: actions/checkout@v5
      - name: Build, audit dependencies and verify board package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python hardware/build.py --board "${{ matrix.board }}" --build --verify
      - name: Upload firmware and matching debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            hardware/build/${{ matrix.board }}/*.bin
            hardware/build/${{ matrix.board }}/*.elf
            hardware/build/${{ matrix.board }}/*.map
            hardware/build/${{ matrix.board }}/firmware-manifest.json
            hardware/build/${{ matrix.board }}/flasher_args.json
            hardware/build/${{ matrix.board }}/project_description.json
            hardware/build/${{ matrix.board }}/compile_commands.json
            hardware/build/${{ matrix.board }}/config/sdkconfig.h
            hardware/build/${{ matrix.board }}/bootloader/bootloader.bin
            hardware/build/${{ matrix.board }}/partition_table/partition-table.bin
          if-no-files-found: error

  server:  # legacy v0.1.0 architecture, kept working
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
